services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-podemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podemos}
      POSTGRES_DB: ${POSTGRES_DB:-podemos_peru}
    volumes:
      - pp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-podemos} -d ${POSTGRES_DB:-podemos_peru}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-podemos}:${POSTGRES_PASSWORD:-podemos}@db:5432/${POSTGRES_DB:-podemos_peru}
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APISPERU_TOKEN: ${APISPERU_TOKEN:-}
      APISPERU_BASE_URL: ${APISPERU_BASE_URL:-https://dniruc.apisperu.com/api/v1}
    expose:
      - "8000"
    entrypoint: ["sh", "entrypoint.sh"]

volumes:
  pp_db_data:
